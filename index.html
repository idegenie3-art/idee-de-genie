<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDÉE DE GÉNIE — Gestion</title>
<style>
:root{--blue:#079dd5;--blue2:#087fb4;--green:#58b52b;--ink:#252322;--muted:#68727b;--bg:#f3f6f8;--card:#fff;--line:#e2e8ed;--red:#c94141}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px}.mark{width:38px;height:38px;position:relative;flex:none}.mark:before{content:"";position:absolute;left:1px;top:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:32px solid var(--blue);transform:rotate(-8deg)}.mark:after{content:"";position:absolute;right:-1px;bottom:1px;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:22px solid var(--green)}.brand small{display:block;font-weight:500;color:var(--muted);font-size:10px;letter-spacing:1px}.rolebox{display:flex;align-items:center;gap:8px}.rolebox select{max-width:165px;padding:8px;border:1px solid var(--line);border-radius:10px;background:white}.layout{display:flex;max-width:1400px;margin:auto}.side{width:220px;padding:18px 12px;flex:none}.navbtn{width:100%;display:flex;gap:12px;align-items:center;text-align:left;border:0;background:transparent;color:#49545c;padding:12px;border-radius:12px;margin:3px 0}.navbtn.active{background:#e1f5fc;color:var(--blue2);font-weight:750}.navbtn .ico{width:24px;text-align:center;font-size:18px}.main{min-width:0;flex:1;padding:24px 22px 90px}.heading{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap;margin-bottom:20px}.heading h1{margin:0;font-size:clamp(23px,3vw,31px)}.sub{color:var(--muted);margin-top:4px}.pill{background:#e7f7df;color:#287d12;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 2px 8px #182a3507}.metric{display:flex;justify-content:space-between;gap:8px;align-items:start}.metric .label{color:var(--muted);font-size:13px}.metric .value{font-size:26px;font-weight:800;margin-top:7px}.metric .badgeicon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#e5f6fc;color:var(--blue2);font-size:19px}.metric.green .badgeicon{background:#eaf8e4;color:#3b8b1c}.section{margin-top:18px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.sectionhead h2{font-size:17px;margin:0}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:white;font-weight:700}.btn.green{background:var(--green)}.btn.light{background:#eaf4f8;color:var(--blue2)}.btn.danger{background:#fff0f0;color:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}.quick{display:flex;gap:8px;flex-wrap:wrap}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:560px}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px}.status{display:inline-block;border-radius:99px;padding:4px 8px;background:#e9f8e3;color:#337f1b;font-size:12px;font-weight:700}.status.orange{background:#fff3dd;color:#95640a}.status.blue{background:#e1f5fc;color:#087ca8}.notice{padding:12px 14px;border-radius:12px;background:#eaf7fc;color:#155d78;margin-bottom:15px}.empty{color:var(--muted);padding:22px 4px}.formrow{display:flex;gap:9px;flex-wrap:wrap}.formrow input,.formrow select{padding:10px;border:1px solid var(--line);border-radius:10px;min-width:130px;background:white}.formrow input{flex:1}.mobile-nav{display:none}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.permission{display:flex;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.permission input{accent-color:var(--blue)}footer{padding:22px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:900px){.side{display:none}.main{padding:18px 13px 95px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px 3px calc(6px + env(safe-area-inset-bottom));z-index:10;justify-content:space-around}.mobile-nav button{border:0;background:transparent;color:#67727b;font-size:10px;display:flex;align-items:center;flex-direction:column;gap:3px;padding:6px 3px;min-width:0;flex:1}.mobile-nav button span{font-size:19px}.mobile-nav button.active{color:var(--blue2);font-weight:800}.top{padding:11px 12px}.brand{font-size:14px}.rolebox select{max-width:125px;font-size:12px}.mark{transform:scale(.85);margin-left:-3px;margin-right:-3px}.metric .value{font-size:23px}}
@media(max-width:380px){.grid{gap:9px}.card{padding:12px}.metric .value{font-size:20px}.brand small{font-size:8px}.rolebox select{max-width:110px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="mark"></div><div>IDÉE DE GÉNIE<small>L'IDÉAL POUR UN FUTUR MEILLEUR</small></div></div><div class="rolebox"><span class="muted">Profil démo</span><select id="role" aria-label="Choisir le profil"><option value="dg">Directeur général</option><option value="admin">Administrateur</option><option value="compta">Comptable</option><option value="tech">Technicien</option><option value="secret">Secrétaire</option></select></div></header>
<div class="layout"><aside class="side" id="side"></aside><main class="main"><div id="content"></div><footer>Prototype de démonstration · Données fictives · Ne pas utiliser pour des informations réelles</footer></main></div><nav class="mobile-nav" id="mobile"></nav></div>
<script>
const modules=[['home','⌂','Accueil'],['clients','♙','Clients'],['interventions','⚒','Interventions'],['finances','▤','Finances'],['stock','▦','Stock'],['fournisseurs','⇄','Fournisseurs'],['employes','♧','Employés'],['rapports','▥','Rapports'],['profil','⚙','Mon profil']];
const roleNames={dg:'Directeur général',admin:'Administrateur',compta:'Comptable',tech:'Technicien',secret:'Secrétaire'};
const data={clients:[['C-001','Société Sahel','+227 90 00 00 01','Actif'],['C-002','Entreprise Horizon','+227 90 00 00 02','Actif'],['C-003','Client Démo','+227 90 00 00 03','À suivre']],interventions:[['INT-024','Société Sahel','Maintenance ordinateur','En cours'],['INT-023','Entreprise Horizon','Installation réseau','Terminée'],['INT-022','Client Démo','Diagnostic imprimante','En attente']],invoices:[['FAC-2026-014','Société Sahel','125 000 FCFA','À payer'],['FAC-2026-013','Entreprise Horizon','85 000 FCFA','Payée'],['FAC-2026-012','Client Démo','40 000 FCFA','À vérifier']],stock:[['ST-001','Câble réseau','24','Bon'],['ST-002','Souris USB','8','À surveiller'],['ST-003','Disque SSD','3','Faible']],fournisseurs:[['FOU-01','Tech Distribution','Matériel informatique','Actif'],['FOU-02','Électronique Plus','Composants','Actif']],employes:[['EMP-01','Amina (démo)','Comptable','Factures : créer/modifier'],['EMP-02','Moussa (démo)','Technicien','Interventions'],['EMP-03','Employé (démo)','Secrétaire','Clients selon autorisation']]};
let current='home';
function canSee(id,role){if(['home','profil'].includes(id))return true;if(role==='dg')return true;if(role==='admin')return true;if(role==='compta')return ['clients','finances','interventions','stock','fournisseurs','rapports'].includes(id);if(role==='tech')return ['interventions','stock','clients'].includes(id);if(role==='secret')return ['clients','interventions'].includes(id);return false}
function navHTML(target){return modules.filter(m=>canSee(m[0],document.getElementById('role').value)).map(m=>`<button class="navbtn ${current===m[0]?'active':''}" data-page="${m[0]}"><span class="ico">${m[1]}</span>${m[2]}</button>`).join('')}
function drawNav(){document.getElementById('side').innerHTML=navHTML('side');document.getElementById('mobile').innerHTML=modules.filter(m=>canSee(m[0],document.getElementById('role').value)).slice(0,5).map(m=>`<button class="${current===m[0]?'active':''}" data-page="${m[0]}"><span>${m[1]}</span>${m[2]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;render()})}
function metric(label,value,icon,green=false){return `<div class="card metric ${green?'green':''}"><div><div class="label">${label}</div><div class="value">${value}</div></div><div class="badgeicon">${icon}</div></div>`}
function table(rows,headers,actions=false){return `<div class="tablewrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}${actions?'<th>Action</th>':''}</tr></thead><tbody>${rows.map((r,i)=>`<tr>${r.map((c,j)=>`<td>${j===r.length-1&&['Actif','En cours','Terminée','En attente','À payer','Payée','À vérifier','Bon','À surveiller','Faible'].includes(c)?`<span class="status ${['À payer','À vérifier','Faible','À surveiller','En attente'].includes(c)?'orange':(['En cours'].includes(c)?'blue':'')}">${c}</span>`:c}</td>`).join('')}${actions?`<td><button class="btn light" onclick="editInvoice(${i})" ${document.getElementById('role').value!=='compta'?'disabled':''}>Corriger</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function render(){drawNav();const role=document.getElementById('role').value;const c=document.getElementById('content');let h='';
if(current==='home'){h=`<div class="heading"><div><h1>Bonjour, ${roleNames[role]}</h1><div class="sub">Voici le résumé de l'entreprise aujourd'hui.</div></div><span class="pill">Mode démonstration</span></div><div class="grid">${metric('Clients enregistrés','128','♙')}${metric('Interventions en cours','12','⚒')}${role==='tech'?'':metric('Recettes du mois','1 250 000','↗',true)}${role==='tech'?'':metric('Dépenses du mois','430 000','↘')}${metric('Articles en stock','246','▦')}${metric('Stock à surveiller','3','!',true)}</div><div class="section card"><div class="sectionhead"><h2>Accès rapides</h2></div><div class="quick">${modules.filter(m=>['clients','interventions','finances','stock','rapports'].includes(m[0])&&canSee(m[0],role)).map(m=>`<button class="btn light" data-page="${m[0]}">${m[1]} ${m[2]}</button>`).join('')}</div></div><div class="section card"><div class="sectionhead"><h2>Dernières interventions</h2><button class="btn light" data-page="interventions">Voir tout</button></div>${table(data.interventions.slice(0,3),['Référence','Client','Intervention','État'])}</div>`}
else if(current==='clients'){h=`<div class="heading"><div><h1>Clients</h1><div class="sub">Répertoire des clients et coordonnées.</div></div><button class="btn" onclick="addRow('clients')">+ Ajouter un client</button></div><div class="card">${table(data.clients,['Référence','Client','Téléphone','État'])}</div><p class="muted">Données fictives de démonstration.</p>`}
else if(current==='interventions'){h=`<div class="heading"><div><h1>Interventions</h1><div class="sub">Suivi des demandes et travaux techniques.</div></div><button class="btn" onclick="addRow('interventions')">+ Nouvelle intervention</button></div><div class="card">${table(data.interventions,['Référence','Client','Travail','État'])}</div>`}
else if(current==='finances'){h=`<div class="heading"><div><h1>Finances & factures</h1><div class="sub">La comptable peut créer et corriger les factures. La direction consulte.</div></div>${role==='compta'?'<button class="btn" onclick="addInvoice()">+ Créer une facture</button>':''}</div><div class="notice">🔒 Droits actuels : ${role==='compta'?'création et correction activées dans cette démonstration.':role==='dg'?'consultation uniquement ; aucune modification de facture.':'consultation selon le profil de démonstration.'} Les changements de ce prototype ne constituent pas un système sécurisé.</div><div class="grid">${metric('Factures du mois','14','▤')}${metric('En attente','3','◷')}${metric('Facturé ce mois','1 250 000','↗',true)}${metric('Reste à encaisser','215 000','!')}</div><div class="section card"><div class="sectionhead"><h2>Factures récentes</h2><span class="muted">Historique simulé</span></div>${table(data.invoices,['N° facture','Client','Montant','Statut'],true)}</div><div class="section card"><h2>Historique des corrections (exemple)</h2><p class="muted">Aucune correction réelle enregistrée. En version finale, chaque changement devra garder la date, l'utilisateur, l'ancienne valeur et la nouvelle valeur.</p></div>`}
else if(current==='stock'){h=`<div class="heading"><div><h1>Stock</h1><div class="sub">Articles et niveaux de stock.</div></div><button class="btn" onclick="addRow('stock')">+ Ajouter un article</button></div><div class="card">${table(data.stock,['Référence','Article','Quantité','État'])}</div>`}
else if(current==='fournisseurs'){h=`<div class="heading"><div><h1>Fournisseurs</h1><div class="sub">Contacts des fournisseurs.</div></div><button class="btn" onclick="addRow('fournisseurs')">+ Ajouter un fournisseur</button></div><div class="card">${table(data.fournisseurs,['Référence','Fournisseur','Spécialité','État'])}</div>`}
else if(current==='employes'){h=`<div class="heading"><div><h1>Employés & autorisations</h1><div class="sub">Aperçu des fonctions et droits prévus.</div></div></div><div class="notice">Le choix de profil ci-dessus sert uniquement à tester l'interface. Il ne remplace pas une vraie connexion sécurisée.</div><div class="card">${table(data.employes,['Référence','Employé de démo','Fonction','Accès prévu'])}</div><div class="section card"><h2>Règles de facturation</h2><div class="permission">✓ Directeur général : consulter les factures, sans les modifier.</div><div class="permission">✓ Comptable : créer et corriger les factures ; corrections tracées.</div><div class="permission">✓ Administrateur : droits définis par le directeur général.</div><div class="permission">✓ Technicien : pas d'accès aux finances par défaut.</div></div>`}
else if(current==='rapports'){h=`<div class="heading"><div><h1>Rapports</h1><div class="sub">Indicateurs synthétiques pour le pilotage.</div></div></div><div class="grid">${metric('Interventions terminées','36','✓',true)}${metric('Clients actifs','112','♙')}${metric('Factures en attente','3','◷')}${metric('Stock faible','3','!')}</div><div class="section card"><h2>Rapport mensuel</h2><p>Cette page affichera les chiffres calculés à partir des données réelles une fois la base de données connectée.</p></div>`}
else {h=`<div class="heading"><div><h1>Mon profil</h1><div class="sub">Profil de démonstration actuel.</div></div></div><div class="card"><p><b>Fonction sélectionnée :</b> ${roleNames[role]}</p><p class="muted">Dans la version finale, chaque employé disposera d'un compte personnel, avec des autorisations gérées côté serveur.</p><button class="btn light" onclick="alert('La connexion sécurisée sera ajoutée dans la version avec base de données.')">Sécurité du compte</button></div>`}
c.innerHTML=h;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;render()})}
function addRow(which){let vals=prompt('Saisis les informations séparées par des virgules. Exemple : REF-004,Nom,Information,État');if(!vals)return;let arr=vals.split(',').map(s=>s.trim());if(arr.length>=data[which][0].length){data[which].unshift(arr.slice(0,data[which][0].length));render()}else alert('Ajoute '+data[which][0].length+' éléments séparés par des virgules.')}
function addInvoice(){let v=prompt('Saisis : numéro de facture, client, montant en FCFA, statut');if(!v)return;let a=v.split(',').map(s=>s.trim());if(a.length>=4){data.invoices.unshift(a.slice(0,4));render()}else alert('Exemple : FAC-2026-015,Client Démo,50000 FCFA,À vérifier')}
function editInvoice(i){if(document.getElementById('role').value!=='compta'){alert('Ce profil ne peut pas modifier les factures.');return}let old=data.invoices[i].join(', ');let v=prompt('Corriger les informations (numéro, client, montant, statut). Ancienne valeur : '+old,old);if(!v)return;let a=v.split(',').map(s=>s.trim());if(a.length>=4){data.invoices[i]=a.slice(0,4);alert('Correction simulée. En version finale, la date, l’utilisateur et les anciennes valeurs seront conservés dans un historique sécurisé.');render()}else alert('Il faut 4 éléments séparés par des virgules.')}
document.getElementById('role').addEventListener('change',()=>{if(!canSee(current,document.getElementById('role').value))current='home';render()});render();
</script></body></html>
